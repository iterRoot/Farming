# Render Blueprint — free tier, database on Neon. Deploy with: New + > Blueprint > pick this file
# (Render defaults to render.yaml, so enter "render.free.yaml" as the Blueprint path).
#
# After the first sync, open the service > Environment and set DB_CONNECTION (see below).
#
# Free-tier limits to know about:
#   - The web service sleeps after ~15 min idle; the first request then takes ~30-60 s.
#   - Its disk is ephemeral: files under Storage/attachments are lost on every restart/redeploy.
#   - Neon's free compute pauses when idle; the first query after a pause is a bit slower.
#
# No healthCheckPath on purpose: every endpoint (including "/") requires a JWT, so any
# path would return 401 and Render would mark the deploy as failed.

services:
  - type: web
    name: farming-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: PORT
        value: "10000"
      # Render terminates TLS at its proxy; trust X-Forwarded-Proto so UseHttpsRedirection doesn't loop.
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      # Signing key for JWTs (must be >= 32 bytes). Generated once and kept across deploys.
      - key: Jwt__Key
        generateValue: true
      # Applies EF migrations on boot (see Program.cs) — a fresh database has no tables.
      - key: RunMigrationsOnStartup
        value: "true"
      # Neon connection string, set by hand in the Render dashboard (sync: false keeps it out of git).
      # Npgsql needs the key=value form, NOT Neon's postgresql:// URL:
      #   Host=<endpoint>.<region>.aws.neon.tech;Database=<db>;Username=<user>;Password=<password>;SSL Mode=Require
      # Use the DIRECT host (no "-pooler" in the name): EF migrations take a session advisory lock,
      # which Neon's pooled endpoint doesn't support.
      - key: DB_CONNECTION
        sync: false
